<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDNET Tunnel Pro — Web Edition</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --terminal-bg: #020617;
            --terminal-green: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.25rem;
            color: var(--accent-cyan);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .badge-disconnected {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .badge-connected {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .field-group {
            margin-bottom: 14px;
        }

        .field-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        select, input, textarea {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus, textarea:focus {
            border-color: var(--accent-cyan);
        }

        textarea {
            font-family: monospace;
            font-size: 0.8rem;
            resize: vertical;
            min-height: 60px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s;
            margin-bottom: 16px;
        }

        .btn-start {
            background-color: var(--accent-cyan);
            color: var(--bg-dark);
        }

        .btn-stop {
            background-color: var(--accent-red);
            color: var(--text-primary);
        }

        .btn:hover {
            opacity: 0.9;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .terminal-header span {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .clear-btn {
            background: none;
            border: none;
            color: var(--accent-cyan);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        .terminal-box {
            background: var(--terminal-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            flex-grow: 1;
            min-height: 220px;
            max-height: 350px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--terminal-green);
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>BDNET TUNNEL PRO</h1>
        <div id="statusBadge" class="badge badge-disconnected">Disconnected</div>
    </div>

    <div class="card">
        <div class="field-group">
            <label for="methodSelect">Tunneling Method</label>
            <select id="methodSelect">
                <option value="ws">Method 2: WebSocket Relay (WSS)</option>
                <option value="vless">Method 5: VLESS over WebSocket</option>
                <option value="ssh">Method 3: SSH over WebSocket Bridge</option>
                <option value="dns">Method 1: DNS Tunneling (Base32 UDP)</option>
                <option value="sni">Method 4: SNI Payload Injector</option>
                <option value="http">Method 6: HTTP CONNECT Proxy</option>
            </select>
        </div>

        <div class="field-group">
            <label for="serverUrl">Server URL (Ngrok / Public Endpoint)</label>
            <input type="text" id="serverUrl" value="https://battery-twirl-designate.ngrok-free.dev">
        </div>

        <div class="field-group">
            <label for="bugHost">Bug Host / SNI Target</label>
            <input type="text" id="bugHost" value="m.facebook.com">
        </div>

        <div class="field-group">
            <label for="payload">Custom HTTP Payload</label>
            <textarea id="payload">GET / HTTP/1.1[crlf]Host: [host][crlf]Upgrade: websocket[crlf][crlf]</textarea>
        </div>
    </div>

    <button id="connectBtn" class="btn btn-start">START TUNNEL</button>

    <div class="terminal-header">
        <span>Live Console Terminal</span>
        <button id="clearLogsBtn" class="clear-btn">CLEAR</button>
    </div>

    <div id="terminalLog" class="terminal-box">[READY] Select method and tap START TUNNEL...&#10;</div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const statusBadge = document.getElementById('statusBadge');
        const terminalLog = document.getElementById('terminalLog');
        const clearLogsBtn = document.getElementById('clearLogsBtn');
        const methodSelect = document.getElementById('methodSelect');
        const serverUrlInput = document.getElementById('serverUrl');
        const bugHostInput = document.getElementById('bugHost');
        const payloadInput = document.getElementById('payload');

        let isConnected = false;
        let activeWs = null;

        function log(tag, msg) {
            const time = new Date().toLocaleTimeString();
            terminalLog.textContent += `[${time}][${tag}] ${msg}\n`;
            terminalLog.scrollTop = terminalLog.scrollHeight;
        }

        clearLogsBtn.addEventListener('click', () => {
            terminalLog.textContent = '';
        });

        connectBtn.addEventListener('click', () => {
            if (isConnected) {
                disconnect();
            } else {
                connect();
            }
        });

        function connect() {
            const method = methodSelect.value;
            const baseUrl = serverUrlInput.value.trim().replace(/\/$/, "");
            const wsBase = baseUrl.replace(/^http/, "ws");

            log("SYSTEM", `Initiating ${methodSelect.options[methodSelect.selectedIndex].text}`);
            log("SYSTEM", `Target URL: ${baseUrl}`);

            if (method === "ws" || method === "vless" || method === "ssh") {
                let endpoint = "/ws";
                if (method === "vless") endpoint = "/vless";
                if (method === "ssh") endpoint = "/ssh-relay";

                const fullWsUrl = `${wsBase}${endpoint}`;
                log("WEBSOCKET", `Connecting to WebSocket: ${fullWsUrl}`);

                try {
                    activeWs = new WebSocket(fullWsUrl);

                    activeWs.onopen = () => {
                        isConnected = true;
                        updateUI(true);
                        log("WEBSOCKET", "Connected successfully to tunnel endpoint!");
                    };

                    activeWs.onmessage = (event) => {
                        log("TUNNEL", `Received packet (${event.data.size || event.data.length || 0} bytes)`);
                    };

                    activeWs.onerror = (err) => {
                        log("ERROR", "WebSocket connection error occurred.");
                    };

                    activeWs.onclose = (evt) => {
                        log("SYSTEM", `Tunnel connection closed (Code: ${evt.code})`);
                        disconnect();
                    };
                } catch (e) {
                    log("ERROR", `Failed to open connection: ${e.message}`);
                }
            } else {
                // HTTP / DNS / SNI simulation mode
                isConnected = true;
                updateUI(true);
                log("TUNNEL", `Connected in Proxy Mode (${method.toUpperCase()})`);
                log("CONFIG", `Bug Host: ${bugHostInput.value}`);
                log("CONFIG", `Payload: ${payloadInput.value.replace(/\[crlf\]/g, "\\r\\n")}`);
            }
        }

        function disconnect() {
            if (activeWs) {
                try { activeWs.close(); } catch (e) {}
                activeWs = null;
            }
            isConnected = false;
            updateUI(false);
            log("SYSTEM", "Disconnected.");
        }

        function updateUI(connected) {
            if (connected) {
                connectBtn.textContent = "STOP TUNNEL";
                connectBtn.className = "btn btn-stop";
                statusBadge.textContent = "Connected";
                statusBadge.className = "badge badge-connected";
            } else {
                connectBtn.textContent = "START TUNNEL";
                connectBtn.className = "btn btn-start";
                statusBadge.textContent = "Disconnected";
                statusBadge.className = "badge badge-disconnected";
            }
        }
    </script>
</body>
</html>
